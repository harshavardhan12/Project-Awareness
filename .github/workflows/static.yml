<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cybersecurity Awareness Month </title>
<style>
  :root{
    --bg:#05080d;
    --panel:#0a111a;
    --panel2:#0f1823;
    --text:#eef8ff;
    --muted:#91a6b8;
    --cyan:#48e5ff;
    --green:#67ff8f;
    --yellow:#ffd166;
    --red:#ff5d73;
    --purple:#b98cff;
    --border:rgba(111,231,255,.18);
    --shadow:0 25px 70px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(72,229,255,.09), transparent 35%),
      radial-gradient(circle at 90% 20%, rgba(103,255,143,.06), transparent 30%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  button,input{font:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}
  .screen{min-height:100vh}

  /* HERO */
  #hero{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    isolation:isolate;
    background-image:
      linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.54) 42%,rgba(0,0,0,.30) 100%),
      url("data:image/webp;base64,");
    background-size:cover;
    background-position:center;
  }
  #hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.018) 4px);
    mix-blend-mode:screen;
    pointer-events:none;
  }
  #hero::after{
    content:"";
    position:absolute; inset:0;
    box-shadow:inset 0 0 180px 60px rgba(0,0,0,.82);
    pointer-events:none;
  }
  .hero-shell{
    position:relative;
    z-index:2;
    width:min(1180px,92vw);
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:48px;
    align-items:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:1px solid rgba(72,229,255,.25);
    background:rgba(3,9,14,.58);
    padding:8px 12px;
    border-radius:999px;
    color:#c8f7ff;
    font-size:.82rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    backdrop-filter:blur(8px);
  }
  .pulse-dot{
    width:8px;height:8px;border-radius:50%;background:var(--green);
    box-shadow:0 0 18px var(--green);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
  h1{
    font-size:clamp(2.7rem,6vw,6.4rem);
    line-height:.92;
    margin:20px 0 18px;
    letter-spacing:-.055em;
    max-width:900px;
  }
  .accent{
    color:transparent;
    background:linear-gradient(90deg,var(--cyan),#eaffff 42%,var(--green));
    -webkit-background-clip:text;
    background-clip:text;
  }
  .trs{
    color:var(--green);
    font-size:.52em;
    letter-spacing:.06em;
    vertical-align:middle;
    white-space:nowrap;
  }
  .hero-copy{
    max-width:690px;
    font-size:clamp(1rem,1.6vw,1.22rem);
    line-height:1.7;
    color:#c2d0dc;
  }
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
  .primary-btn,.secondary-btn{
    border:none;
    border-radius:14px;
    padding:15px 22px;
    font-weight:800;
    letter-spacing:.02em;
    transition:.2s ease;
  }
  .primary-btn{
    background:linear-gradient(135deg,var(--cyan),var(--green));
    color:#001018;
    box-shadow:0 10px 28px rgba(72,229,255,.2);
  }
  .primary-btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
  .secondary-btn{
    background:rgba(5,13,20,.68);
    color:#d6edf5;
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
  }
  .terminal{
    background:rgba(3,7,11,.72);
    border:1px solid rgba(72,229,255,.2);
    border-radius:18px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(10px);
    overflow:hidden;
  }
  .terminal-head{
    display:flex;align-items:center;gap:8px;
    padding:12px 15px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.025);
  }
  .term-dot{width:10px;height:10px;border-radius:50%;background:#213241}
  .terminal-body{
    padding:22px;
    min-height:260px;
    font-family:"SFMono-Regular",Consolas,monospace;
    color:#bdeef6;
    line-height:1.8;
    font-size:.93rem;
  }
  .prompt{color:var(--green)}
  .cursor{
    display:inline-block;width:9px;height:1.05em;background:var(--cyan);vertical-align:-2px;
    animation:blink .85s steps(1) infinite
  }
  @keyframes blink{50%{opacity:0}}

  /* GAME */
  #game{padding:0 0 80px}
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:14px min(4vw,56px);
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,8,13,.84);
    backdrop-filter:blur(16px);
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:900}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--cyan),var(--green));color:#00151b;font-weight:1000;
  }
  .status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .chip{
    border:1px solid rgba(255,255,255,.09);background:#0b121a;
    color:#bbcad6;padding:8px 12px;border-radius:999px;font-size:.85rem
  }
  .chip strong{color:#fff}
  .progress{
    height:6px;width:120px;background:#13202b;border-radius:99px;overflow:hidden
  }
  .progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:.35s}

  .game-shell{width:min(1180px,92vw);margin:0 auto;padding-top:42px}
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
  .section-head h2{font-size:clamp(1.8rem,3vw,3rem);margin:0}
  .section-head p{margin:7px 0 0;color:var(--muted)}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
  }
  .mission{
    position:relative;
    min-height:165px;
    padding:16px;
    border-radius:18px;
    border:1px solid var(--border);
    background:
      linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.005)),
      #0b121a;
    color:var(--text);
    text-align:left;
    overflow:hidden;
    transition:.22s ease;
  }
  .mission:not(.locked):hover{transform:translateY(-4px);border-color:rgba(72,229,255,.45);box-shadow:0 14px 34px rgba(0,0,0,.28)}
  .mission.locked{filter:saturate(.45);opacity:.58;cursor:not-allowed}
  .mission.done{border-color:rgba(103,255,143,.48);box-shadow:inset 0 0 0 1px rgba(103,255,143,.08)}
  .mission-num{font-size:.72rem;color:#7991a5;letter-spacing:.14em;text-transform:uppercase}
  .mission-title{font-size:1rem;font-weight:850;margin-top:66px;line-height:1.2}
  .mission-art{
    position:absolute;right:-4px;top:-6px;width:112px;height:90px;opacity:.95;
  }
  .lock{
    position:absolute;top:12px;right:12px;padding:5px 8px;border-radius:999px;
    background:rgba(0,0,0,.42);font-size:.7rem;color:#d6e0e8;border:1px solid rgba(255,255,255,.08)
  }
  .done-tag{color:var(--green)}

  /* modal */
  .modal-backdrop{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
    background:rgba(0,0,0,.74);backdrop-filter:blur(9px)
  }
  .modal{
    width:min(820px,96vw);
    max-height:90vh;overflow:auto;
    background:#081019;
    border:1px solid rgba(72,229,255,.22);
    border-radius:22px;
    box-shadow:0 30px 100px rgba(0,0,0,.58);
  }
  .modal-header{
    display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
    padding:22px 24px;border-bottom:1px solid rgba(255,255,255,.07)
  }
  .modal-header h3{margin:4px 0 0;font-size:1.55rem}
  .kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.15em;color:var(--cyan);font-weight:900}
  .close{
    border:1px solid rgba(255,255,255,.1);background:#0f1822;color:#c6d6e1;
    width:38px;height:38px;border-radius:10px;font-size:1.15rem
  }
  .modal-body{padding:24px}
  .question{font-size:1.08rem;line-height:1.65;color:#e9f4fb;margin:0 0 20px}
  .hint{color:#91a8b8;font-size:.9rem;line-height:1.6}
  .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
  .option{
    padding:15px;border:1px solid rgba(255,255,255,.1);background:#0e1720;color:#dfeaf1;
    border-radius:14px;text-align:left;transition:.15s
  }
  .option:hover{border-color:rgba(72,229,255,.45);transform:translateY(-1px)}
  .option.selected{outline:2px solid var(--cyan)}
  .input{
    width:100%;border:1px solid rgba(255,255,255,.12);background:#060b10;color:white;
    border-radius:12px;padding:14px 15px;outline:none
  }
  .input:focus{border-color:var(--cyan)}
  .submit-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}
  .submit{
    border:none;border-radius:12px;padding:13px 18px;font-weight:900;
    background:linear-gradient(135deg,var(--cyan),var(--green));color:#001119
  }
  .feedback{
    margin-top:16px;padding:13px 15px;border-radius:12px;border:1px solid transparent;
    display:none;line-height:1.5
  }
  .feedback.show{display:block}
  .feedback.good{background:rgba(103,255,143,.08);border-color:rgba(103,255,143,.25);color:#b8ffcb}
  .feedback.bad{background:rgba(255,93,115,.08);border-color:rgba(255,93,115,.25);color:#ffc2cb}

  .sortable{display:grid;gap:10px;margin-top:15px}
  .sort-item{
    display:flex;align-items:center;gap:12px;padding:13px 14px;background:#0e1720;
    border:1px solid rgba(255,255,255,.09);border-radius:12px
  }
  .sort-controls{margin-left:auto;display:flex;gap:6px}
  .sort-controls button{
    width:34px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.1);
    background:#111d28;color:#d7e7f0
  }
  .phish-card{
    border:1px solid rgba(255,255,255,.09);border-radius:14px;background:#0c141d;padding:17px;margin:14px 0;
    font-family:Arial,sans-serif
  }
  .phish-row{display:flex;gap:10px;margin:6px 0;color:#b8c8d3}
  .phish-row strong{color:#fff;width:70px}
  .redflag{
    display:inline-block;border:1px dashed rgba(255,209,102,.65);border-radius:6px;padding:1px 4px
  }
  .timer-wrap{
    display:flex;align-items:center;gap:16px;padding:15px;border-radius:14px;
    background:#0c151e;border:1px solid rgba(255,255,255,.08);margin-bottom:15px
  }
  .timer{font-size:2rem;font-weight:1000;color:var(--yellow);font-variant-numeric:tabular-nums}
  .scenario{
    background:linear-gradient(135deg,rgba(185,140,255,.08),rgba(72,229,255,.05));
    border:1px solid rgba(185,140,255,.18);padding:18px;border-radius:14px;line-height:1.6
  }
  .ai-card{
    padding:13px;border-radius:12px;background:#0e1720;border:1px solid rgba(255,255,255,.09);margin:10px 0
  }
  .dropzones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .dropzone{min-height:100px;padding:14px;border-radius:13px;border:1px dashed rgba(255,255,255,.18);background:#091119}
  .dropzone h4{margin:0 0 8px}
  .mini-btn{
    border:1px solid rgba(255,255,255,.1);background:#121d27;color:#dbe7ee;border-radius:9px;padding:8px 10px;margin:4px 4px 0 0
  }
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    z-index:200;background:#0d1821;color:white;border:1px solid rgba(255,255,255,.11);
    padding:13px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow)
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .finale{
    text-align:center;padding:20px 5px
  }
  .finale .big{font-size:4rem}
  .finale h3{font-size:2rem;margin:5px 0 10px}
  .finale p{color:#a8bdca;line-height:1.6}
  .badge{
    display:inline-block;margin-top:12px;padding:9px 13px;border-radius:999px;
    background:rgba(103,255,143,.08);border:1px solid rgba(103,255,143,.22);color:#aaffbe;font-weight:800
  }
  footer{width:min(1180px,92vw);margin:40px auto 0;color:#6f8596;font-size:.8rem;text-align:center}
  @media(max-width:980px){
    .hero-shell{grid-template-columns:1fr}
    .terminal{display:none}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .option-grid,.dropzones{grid-template-columns:1fr}
    .status .chip:nth-child(1){display:none}
    h1{font-size:3rem}
  }
</style>
</head>
<body>

<section id="hero" class="screen">
  <div class="hero-shell">
    <div>
      <div class="eyebrow"><span class="pulse-dot"></span> TRS Security Operations // Awareness Challenge</div>
      <h1><span class="accent">Cybersecurity</span><br/>Awareness Month <span class="trs">(TRS)</span></h1>
      <p class="hero-copy">
        Ten short security missions. Each one unlocks the next. Spot the risk, solve the puzzle,
        beat the timed challenge, and finish the awareness run.
      </p>
      <div class="hero-actions">
        <button class="primary-btn" id="startBtn">▶ START MACHINE</button>
        <button class="secondary-btn" id="previewBtn">View Mission Brief</button>
      </div>
    </div>

    <div class="terminal" aria-label="Animated terminal">
      <div class="terminal-head">
        <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
      </div>
      <div class="terminal-body">
        <div><span class="prompt">trs@awareness:~$</span> <span id="typeLine"></span><span class="cursor"></span></div>
        <div id="terminalLog" style="margin-top:18px;color:#7fa0b1"></div>
      </div>
    </div>
  </div>
</section>

<section id="game" class="screen hidden">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">T</span> TRS Cyber Arena</div>
    <div class="status">
      <span class="chip">MODE: <strong>Awareness</strong></span>
      <span class="chip">XP: <strong id="xp">0</strong>/1000</span>
      <div class="progress" title="Progress"><span id="progressFill"></span></div>
    </div>
  </div>

  <main class="game-shell">
    <div class="section-head">
      <div>
        <div class="eyebrow"><span class="pulse-dot"></span> Sequential missions enabled</div>
        <h2 style="margin-top:14px">Choose your next security mission</h2>
        <p>Complete each challenge to unlock the next tile.</p>
      </div>
      <button class="secondary-btn" id="resetBtn">Reset Run</button>
    </div>

    <div class="grid" id="missionGrid"></div>
  </main>
  <footer>Cybersecurity Awareness Month (TRS) • Training demo • Built as a single self-contained HTML file</footer>
</section>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div>
        <div class="kicker" id="modalKicker">Mission</div>
        <h3 id="modalTitle">Title</h3>
      </div>
      <button class="close" id="closeModal">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const missions = [
  {
    title:"Password Power",
    art:"key",
    type:"password",
    desc:"Build the strongest password habit.",
  },
  {
    title:"Shoulder Surfing",
    art:"eye",
    type:"choice",
    desc:"Protect your screen and secrets.",
  },
  {
    title:"MFA Sequence",
    art:"shield",
    type:"order",
    desc:"Put the secure sign-in steps in order.",
  },
  {
    title:"Phishing Hunt",
    art:"hook",
    type:"phish",
    desc:"Spot the suspicious message.",
  },
  {
    title:"Social Engineering",
    art:"chat",
    type:"scenario",
    desc:"Handle an urgent identity request.",
  },
  {
    title:"Lock It Down",
    art:"lock",
    type:"missing",
    desc:"Complete the missing security word.",
  },
  {
    title:"AI Data Safety",
    art:"ai",
    type:"ai",
    desc:"Decide what belongs in a public AI tool.",
  },
  {
    title:"Public Wi‑Fi",
    art:"wifi",
    type:"wifi",
    desc:"Pick the safer connection behavior.",
  },
  {
    title:"Unknown USB",
    art:"usb",
    type:"usb",
    desc:"Choose what to do with found media.",
  },
  {
    title:"Incident Sprint",
    art:"alarm",
    type:"timer",
    desc:"Beat the clock and report correctly.",
  },
];

let unlocked = Number(localStorage.getItem("trsUnlocked") || 0);
let completed = JSON.parse(localStorage.getItem("trsCompleted") || "[]");
let current = null;
let timerInterval = null;
let timeLeft = 15;
let selectedAnswer = null;

const grid = document.getElementById("missionGrid");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalBody = document.getElementById("modalBody");
const xpEl = document.getElementById("xp");
const progressFill = document.getElementById("progressFill");
const toast = document.getElementById("toast");

function iconSVG(kind){
  const common = 'viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg"';
  const g = (inner)=>`<svg ${common}><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#48e5ff"/><stop offset="1" stop-color="#67ff8f"/></linearGradient></defs>${inner}</svg>`;
  const map = {
    key:g('<circle cx="42" cy="42" r="18" fill="none" stroke="url(#g)" stroke-width="7"/><path d="M59 44h45M86 44v13M97 44v9" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>'),
    eye:g('<path d="M12 45s18-27 48-27 48 27 48 27-18 27-48 27S12 45 12 45Z" fill="none" stroke="url(#g)" stroke-width="6"/><circle cx="60" cy="45" r="13" fill="none" stroke="url(#g)" stroke-width="6"/>'),
    shield:g('<path d="M60 8 101 23v25c0 22-16 34-41 42C35 82 19 70 19 48V23L60 8Z" fill="none" stroke="url(#g)" stroke-width="6"/><path d="m42 46 12 12 25-27" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>'),
    hook:g('<path d="M60 8v43c0 18-12 29-27 29S9 69 9 56c0-11 8-20 18-20 8 0 15 6 15 14" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/><path d="M60 8 92 24 60 38" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>'),
    chat:g('<path d="M15 18h90v50H60L36 84V68H15Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/><circle cx="40" cy="43" r="4" fill="#48e5ff"/><circle cx="60" cy="43" r="4" fill="#57efc0"/><circle cx="80" cy="43" r="4" fill="#67ff8f"/>'),
    lock:g('<rect x="24" y="37" width="72" height="45" rx="8" fill="none" stroke="url(#g)" stroke-width="6"/><path d="M39 37V27c0-13 9-20 21-20s21 7 21 20v10" fill="none" stroke="url(#g)" stroke-width="6"/><circle cx="60" cy="58" r="6" fill="#67ff8f"/>'),
    ai:g('<rect x="28" y="18" width="64" height="54" rx="12" fill="none" stroke="url(#g)" stroke-width="6"/><circle cx="48" cy="44" r="5" fill="#48e5ff"/><circle cx="72" cy="44" r="5" fill="#67ff8f"/><path d="M45 58h30M60 18V7M60 83V72M28 45H14M106 45H92" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>'),
    wifi:g('<path d="M15 36c26-24 64-24 90 0M30 52c18-16 42-16 60 0M46 67c8-7 20-7 28 0" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="78" r="5" fill="#67ff8f"/>'),
    usb:g('<path d="M60 80V20M60 20 47 33M60 20l13 13M60 45H36v14M60 56h23V44" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="64" r="7" fill="none" stroke="#48e5ff" stroke-width="5"/><rect x="79" y="33" width="9" height="9" fill="#67ff8f"/>'),
    alarm:g('<circle cx="60" cy="48" r="30" fill="none" stroke="url(#g)" stroke-width="6"/><path d="M60 30v21l14 10M33 14 19 27M87 14l14 13" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>')
  };
  return map[kind];
}

function renderMissions(){
  grid.innerHTML = "";
  missions.forEach((m,i)=>{
    const isDone = completed.includes(i);
    const isLocked = i > unlocked;
    const btn = document.createElement("button");
    btn.className = "mission" + (isLocked?" locked":"") + (isDone?" done":"");
    btn.innerHTML = `
      <div class="mission-num">Mission ${String(i+1).padStart(2,"0")}</div>
      <div class="mission-art">${iconSVG(m.art)}</div>
      <div class="mission-title">${m.title}</div>
      <div style="margin-top:7px;color:#7f94a6;font-size:.78rem">${m.desc}</div>
      ${isLocked?'<span class="lock">🔒 LOCKED</span>':isDone?'<span class="lock done-tag">✓ COMPLETE</span>':'<span class="lock">OPEN</span>'}
    `;
    btn.addEventListener("click",()=> {
      if(isLocked){
        showToast(`Complete Mission ${i} first.`);
        return;
      }
      openMission(i);
    });
    grid.appendChild(btn);
  });
  const xp = completed.length * 100;
  xpEl.textContent = xp;
  progressFill.style.width = `${completed.length*10}%`;
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2100);
}

function openMission(i){
  clearInterval(timerInterval);
  current = i;
  selectedAnswer = null;
  document.getElementById("modalKicker").textContent = `Mission ${String(i+1).padStart(2,"0")} // ${missions[i].type.toUpperCase()}`;
  document.getElementById("modalTitle").textContent = missions[i].title;
  modalBody.innerHTML = challengeHTML(i);
  modalBackdrop.classList.remove("hidden");
  wireChallenge(i);
}

function closeMission(){
  clearInterval(timerInterval);
  modalBackdrop.classList.add("hidden");
}
document.getElementById("closeModal").onclick = closeMission;
modalBackdrop.addEventListener("click",e=>{ if(e.target===modalBackdrop) closeMission(); });

function feedback(ok,msg){
  const el = document.getElementById("feedback");
  el.className = "feedback show " + (ok?"good":"bad");
  el.innerHTML = msg;
}
function completeMission(){
  if(!completed.includes(current)) completed.push(current);
  completed.sort((a,b)=>a-b);
  unlocked = Math.max(unlocked, Math.min(current+1, missions.length-1));
  localStorage.setItem("trsCompleted",JSON.stringify(completed));
  localStorage.setItem("trsUnlocked",unlocked);
  renderMissions();
  tone(true);
  setTimeout(()=>{
    if(current === missions.length-1){
      showFinale();
    }else{
      closeMission();
      showToast(`Mission ${current+1} complete — Mission ${current+2} unlocked.`);
      window.scrollTo({top:0,behavior:"smooth"});
    }
  },850);
}

function tone(ok){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.value=ok?660:180;g.gain.value=.025;
    o.start();o.stop(ac.currentTime+.11);
  }catch(e){}
}

function challengeHTML(i){
  switch(i){
    case 0:
      return `
        <p class="question">Which password approach is strongest for a work account?</p>
        <div class="option-grid">
          ${["Company2026!","Summer@123","A long, unique passphrase used only for this account","The same complex password I use everywhere"].map((x,n)=>`<button class="option" data-answer="${n}">${x}</button>`).join("")}
        </div>
        <p class="hint">Tip: strength is not only about symbols — uniqueness matters.</p>
        <div class="submit-row"><span></span><button class="submit" id="submit">Check Answer</button></div><div id="feedback" class="feedback"></div>`;
    case 1:
      return `
        <div class="scenario"><strong>Scenario:</strong> You are working in a public area and notice someone standing close enough to see your screen.</div>
        <p class="question" style="margin-top:18px">What is the best immediate response?</p>
        <div class="option-grid">
          ${["Ignore them if they look harmless","Turn/lock the screen and reposition yourself","Type faster so they cannot follow","Lower the screen brightness only"].map((x,n)=>`<button class="option" data-answer="${n}">${x}</button>`).join("")}
        </div>
        <div class="submit-row"><span></span><button class="submit" id="submit">Lock In</button></div><div id="feedback" class="feedback"></div>`;
    case 2:
      return `
        <p class="question">Arrange these sign-in events into the most logical secure sequence.</p>
        <div class="sortable" id="sortable">
          ${["Approve the MFA prompt","Open the trusted company sign-in page","Enter your username/password","Verify that the prompt matches your sign-in attempt"].map((x,n)=>`<div class="sort-item" data-id="${n}"><span class="num">${n+1}</span><span>${x}</span><span class="sort-controls"><button class="up">↑</button><button class="down">↓</button></span></div>`).join("")}
        </div>
        <p class="hint">Use the arrows to reorder.</p>
        <div class="submit-row"><span></span><button class="submit" id="submit">Validate Sequence</button></div><div id="feedback" class="feedback"></div>`;
    case 3:
      return `
        <p class="question">You receive this email. Select the <strong>three strongest phishing red flags</strong>.</p>
        <div class="phish-card">
          <div class="phish-row"><strong>From</strong><span id="rf1">IT-Support &lt;helpdesk@trs-secure-login.co&gt;</span></div>
          <div class="phish-row"><strong>Subject</strong><span id="rf2">URGENT: Account suspended in 15 minutes!</span></div>
          <div style="margin-top:15px;line-height:1.55;color:#d9e1e7">We detected an issue with your mailbox. To prevent deletion, <span id="rf3">verify your password immediately using this link</span>.</div>
          <div style="margin-top:14px;color:#7da6ba">https://trs-secure-login.co/verify</div>
        </div>
        <div>
          <button class="mini-btn phish-select" data-rf="1">Sender domain</button>
          <button class="mini-btn phish-select" data-rf="2">Urgent threat</button>
          <button class="mini-btn phish-select" data-rf="3">Password request/link</button>
          <button class="mini-btn phish-select" data-rf="4">The email uses English</button>
        </div>
        <div class="submit-row"><span id="phishCount" class="hint">0 / 3 selected</span><button class="submit" id="submit">Analyze Email</button></div><div id="feedback" class="feedback"></div>`;
    case 4:
      return `
        <div class="scenario"><strong>Incoming call:</strong> “Hi, I’m from IT. Your manager approved an emergency reset. Read me the MFA code you just received so I can fix your access.”</div>
        <p class="question" style="margin-top:18px">Choose the safest action.</p>
        <div class="option-grid">
          ${["Share the code because IT initiated it","Ask for the caller's employee ID, then share it","End the call and contact IT through a known official channel","Share only the first three digits"].map((x,n)=>`<button class="option" data-answer="${n}">${x}</button>`).join("")}
        </div>
        <div class="submit-row"><span></span><button class="submit" id="submit">Respond</button></div><div id="feedback" class="feedback"></div>`;
    case 5:
      return `
        <p class="question">Complete the missing word:</p>
        <div class="scenario" style="font-size:1.2rem">Whenever I step away from my workstation, I should <strong>_____</strong> my screen.</div>
        <input id="textAnswer" class="input" placeholder="Type one word..." autocomplete="off"/>
        <div class="submit-row"><span class="hint">Hint: Windows + L</span><button class="submit" id="submit">Submit Word</button></div><div id="feedback" class="feedback"></div>`;
    case 6:
      return `
        <p class="question">Which item is safest to paste into a <strong>public AI assistant</strong> without company approval?</p>
        <div class="ai-card">A. A public press release already published on the company website</div>
        <div class="ai-card">B. Customer personal information from a support ticket</div>
        <div class="ai-card">C. Internal source code with API keys removed</div>
        <div class="ai-card">D. A confidential incident report with names redacted</div>
        <div class="option-grid">
          ${["A","B","C","D"].map((x,n)=>`<button class="option" data-answer="${n}">Choose ${x}</button>`).join("")}
        </div>
        <p class="hint">Redaction alone does not automatically make internal data approved for public AI tools.</p>
        <div class="submit-row"><span></span><button class="submit" id="submit">Classify Data</button></div><div id="feedback" class="feedback"></div>`;
    case 7:
      return `
        <p class="question">You need to access work resources from a café. Which choice is safest?</p>
        <div class="option-grid">
          ${["Join any open Wi‑Fi named FREE_WIFI","Use a trusted hotspot/VPN according to company policy","Disable the firewall because it slows the connection","Share files over the café network to test connectivity"].map((x,n)=>`<button class="option" data-answer="${n}">${x}</button>`).join("")}
        </div>
        <div class="submit-row"><span></span><button class="submit" id="submit">Secure Connection</button></div><div id="feedback" class="feedback"></div>`;
    case 8:
      return `
        <div class="scenario"><strong>You find an unlabeled USB drive in the parking lot.</strong></div>
        <p class="question" style="margin-top:18px">What should you do?</p>
        <div class="option-grid">
          ${["Plug it into a spare work laptop to identify the owner","Plug it into your personal laptop first","Turn it over to the appropriate security/IT process without connecting it","Format it and reuse it"].map((x,n)=>`<button class="option" data-answer="${n}">${x}</button>`).join("")}
        </div>
        <div class="submit-row"><span></span><button class="submit" id="submit">Choose Action</button></div><div id="feedback" class="feedback"></div>`;
    case 9:
      return `
        <div class="timer-wrap"><div>⏱️</div><div><div class="hint">TIME REMAINING</div><div class="timer" id="timer">15</div></div></div>
        <div class="scenario"><strong>Incident sprint:</strong> You clicked a suspicious link and entered your password before realizing the page looked fake.</div>
        <p class="question" style="margin-top:18px">What should you do <strong>first</strong>?</p>
        <div class="option-grid">
          ${["Delete browser history and continue working","Immediately report it through the company security process and follow containment/reset guidance","Wait to see whether anything unusual happens","Post a warning in a public chat channel with the suspicious link"].map((x,n)=>`<button class="option" data-answer="${n}">${x}</button>`).join("")}
        </div>
        <div class="submit-row"><span class="hint">One timed mission only.</span><button class="submit" id="submit">REPORT</button></div><div id="feedback" class="feedback"></div>`;
  }
}

function wireChallenge(i){
  const opts = [...document.querySelectorAll(".option")];
  opts.forEach(btn=>btn.addEventListener("click",()=>{
    opts.forEach(x=>x.classList.remove("selected"));
    btn.classList.add("selected");
    selectedAnswer = Number(btn.dataset.answer);
  }));

  if(i===2){
    document.querySelectorAll(".up").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); const item=b.closest(".sort-item"), prev=item.previousElementSibling; if(prev) item.parentNode.insertBefore(item,prev);
      renumberSort();
    });
    document.querySelectorAll(".down").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); const item=b.closest(".sort-item"), next=item.nextElementSibling; if(next) item.parentNode.insertBefore(next,item);
      renumberSort();
    });
  }

  if(i===3){
    let picks = new Set();
    document.querySelectorAll(".phish-select").forEach(b=>b.addEventListener("click",()=>{
      const n=Number(b.dataset.rf);
      picks.has(n)?picks.delete(n):picks.add(n);
      b.style.outline=picks.has(n)?"2px solid #48e5ff":"none";
      document.getElementById("phishCount").textContent=`${picks.size} / 3 selected`;
      selectedAnswer=picks;
    }));
  }

  if(i===9){
    timeLeft=15;
    const t=document.getElementById("timer");
    timerInterval=setInterval(()=>{
      timeLeft--; t.textContent=timeLeft;
      if(timeLeft<=0){
        clearInterval(timerInterval);
        feedback(false,"Time expired. In a real incident, speed matters — report quickly so the security team can help contain the impact.");
        document.getElementById("submit").disabled=true;
        setTimeout(()=>{ document.getElementById("submit").disabled=false; timeLeft=15; t.textContent=15; wireTimerRestart(); },1000);
      }
    },1000);
  }

  document.getElementById("submit").onclick=()=>checkAnswer(i);
}
function wireTimerRestart(){}

function renumberSort(){
  [...document.querySelectorAll(".sort-item")].forEach((x,n)=>x.querySelector(".num").textContent=n+1);
}

function checkAnswer(i){
  let ok=false, msg="";
  if(i===0){ok=selectedAnswer===2;msg=ok?"Correct. Prefer long, unique passwords/passphrases and never reuse them across accounts.":"Not quite. The strongest habit is a long, unique password or passphrase used only for that account.";}
  if(i===1){ok=selectedAnswer===1;msg=ok?"Correct. Reduce exposure immediately: lock/angle the screen, reposition, and use privacy controls where appropriate.":"Best action: protect the screen immediately by locking/repositioning rather than assuming the observer is harmless.";}
  if(i===2){
    const order=[...document.querySelectorAll(".sort-item")].map(x=>Number(x.dataset.id));
    ok=JSON.stringify(order)===JSON.stringify([1,2,3,0]);
    msg=ok?"Correct sequence: trusted sign-in page → credentials → verify the MFA prompt belongs to your attempt → approve.":"Try again. First use the trusted sign-in page, enter credentials, verify the MFA prompt matches your action, then approve it.";
  }
  if(i===3){
    const p=selectedAnswer instanceof Set?[...selectedAnswer].sort():[];
    ok=JSON.stringify(p)===JSON.stringify([1,2,3]);
    msg=ok?"Exactly. Look for sender/domain mismatch, urgency or threats, and requests to enter credentials through a link.":"Select exactly three: suspicious sender/domain, urgent threat, and the password/link request.";
  }
  if(i===4){ok=selectedAnswer===2;msg=ok?"Correct. Never disclose MFA codes. End the interaction and independently contact IT using a known official channel.":"Do not share MFA codes. Independently verify the request through a trusted company channel.";}
  if(i===5){
    const a=(document.getElementById("textAnswer").value||"").trim().toLowerCase();
    ok=["lock","secure"].includes(a);msg=ok?"Correct — lock your screen whenever you step away.":"The intended word is “lock.”";
  }
  if(i===6){ok=selectedAnswer===0;msg=ok?"Correct. Public information that is already approved/published is the safest choice here. Sensitive, confidential, customer, or internal data should follow company AI/data handling rules.":"Choose the already-public press release. Internal or sensitive data should not be pasted into a public AI tool unless explicitly approved.";}
  if(i===7){ok=selectedAnswer===1;msg=ok?"Correct. Use trusted connectivity and follow company VPN/hotspot policy rather than relying on unknown open Wi‑Fi.":"The safer option is a trusted hotspot/VPN according to company policy.";}
  if(i===8){ok=selectedAnswer===2;msg=ok?"Correct. Unknown removable media should not be connected to company or personal systems. Route it through the proper security/IT process.":"Do not plug unknown USB media into any device. Turn it over through the approved security/IT process.";}
  if(i===9){
    ok=selectedAnswer===1 && timeLeft>0;
    msg=ok?"Correct — quick reporting enables containment, credential reset, and investigation.":"Report immediately through the company security process and follow the response team's containment/reset instructions.";
    if(ok) clearInterval(timerInterval);
  }
  tone(ok);
  feedback(ok,msg);
  if(ok) setTimeout(completeMission,450);
}

function showFinale(){
  clearInterval(timerInterval);
  document.getElementById("modalKicker").textContent="RUN COMPLETE";
  document.getElementById("modalTitle").textContent="Cyber Awareness Champion";
  modalBody.innerHTML=`
    <div class="finale">
      <div class="big">🛡️</div>
      <h3>Machine Secured.</h3>
      <p>You completed all 10 TRS awareness missions and earned <strong>1000 XP</strong>.</p>
      <span class="badge">✓ TRS CYBER AWARENESS COMPLETE</span>
      <div style="margin-top:24px"><button class="submit" onclick="closeMission()">Return to Mission Board</button></div>
    </div>`;
  modalBackdrop.classList.remove("hidden");
}

document.getElementById("startBtn").onclick=()=>{
  document.getElementById("hero").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  window.scrollTo(0,0);
  renderMissions();
}
document.getElementById("previewBtn").onclick=()=>{
  alert("Mission Brief:\\n\\n• 10 sequential cybersecurity awareness challenges\\n• Passwords, shoulder surfing, MFA, phishing, social engineering, screen locking, AI data safety, public Wi‑Fi, unknown USBs, and incident reporting\\n• Later missions stay locked until the previous mission is completed\\n• Mission 10 is timed");
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Reset all progress and lock Missions 2–10 again?")){
    completed=[];unlocked=0;
    localStorage.removeItem("trsCompleted");localStorage.removeItem("trsUnlocked");
    renderMissions();showToast("Run reset.");
  }
};

renderMissions();

/* terminal typing animation */
const commands=[
  "initializing awareness_protocol...",
  "loading 10 security missions...",
  "checking user readiness...",
  "status: READY",
  "type START_MACHINE to begin"
];
let ci=0, ch=0, deleting=false;
const line=document.getElementById("typeLine");
const log=document.getElementById("terminalLog");
function typeLoop(){
  const str=commands[ci];
  if(!deleting){
    line.textContent=str.slice(0,++ch);
    if(ch===str.length){
      const d=document.createElement("div");
      d.innerHTML=`<span style="color:#67ff8f">[OK]</span> ${str}`;
      log.appendChild(d);
      setTimeout(()=>deleting=true,700);
    }
  }else{
    line.textContent=str.slice(0,--ch);
    if(ch===0){deleting=false;ci=(ci+1)%commands.length;}
  }
  setTimeout(typeLoop,deleting?18:38);
}
typeLoop();
</script>
</body>
</html>
